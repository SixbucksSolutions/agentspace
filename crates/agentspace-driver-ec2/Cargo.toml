[package]
name = "agentspace-driver-ec2"
version = "0.5.0"
edition.workspace = true
description = "The EC2 driver: places a lease by its project's host, renews and releases its credential and alias, starts a provisioning run and places pending leases (docs/driver.md; D38, D48)"
publish = false

[lib]
name = "agentspace_driver_ec2"
path = "src/lib.rs"

# TEST-ONLY. A stand-in for ssh.exe and agentspace-ssh-proxy.exe that the integration tests copy
# under those names into a throwaway folder and start with ssh-like arguments. It MUST NOT be
# installed or shipped. Its source is the test author's.
[[bin]]
name = "agentspace-driver-ec2-stub"
path = "tests/support/stub.rs"
test = false

[dependencies]
agentspace-driver-api = { path = "../agentspace-driver-api" }
agentspace-credential = { path = "../agentspace-credential" }
agentspace-alias = { path = "../agentspace-alias" }
# The host registry, its lock, the project list and a host's run lock (D45, D54, D55).
agentspace-hosts = { path = "../agentspace-hosts" }
# The detached start of a provisioning run (D48, D55).
agentspace-detach = { path = "../agentspace-detach" }
# The release's two walks for the alias's clients, and the text of its log line (D59, D63).
agentspace-connections = { path = "../agentspace-connections" }
# The lease state file and its lock, for place_pending, and the contract's times.
agentspace-state = { path = "../agentspace-state" }

[dev-dependencies]
# For the integration tests: throwaway folders, at the version agentspace-credential and
# agentspace-state already use.
tempfile = { version = "=3.23.0", default-features = false }
# For the integration tests: the operator's `ca`, run in process to make each throwaway CA
# (architect, 2026-11-20, for E0.06-T06-S01).
agentspace-operator-api = { path = "../agentspace-operator-api" }
agentspace-ca = { path = "../agentspace-ca" }
# For the integration tests of E0.07-T03-S01 (the test author's): the Detach trait for a fake start,
# the host registry and its locks to seed and to hold, and the lease state file's JSON to read back.
agentspace-detach = { path = "../agentspace-detach" }
agentspace-hosts = { path = "../agentspace-hosts" }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "preserve_order"] }
