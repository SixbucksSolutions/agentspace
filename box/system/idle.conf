# Minutes with no session and no CPU work before the box powers off.
IDLE_MINUTES=60
# CPU-seconds of work per 5-minute check that count as activity.
BUSY_CPU_SECONDS=6
# Minutes past the lease horizon after which the box powers off at the first
# check with no SSH or Session Manager session and no patch run, whatever its CPU
# is doing (D56, D57; architect, 2026-11-21, for v0.08-T01). The horizon is in
# /run/agentspace/lease-horizon, sent by the guard.
HORIZON_GRACE_MINUTES=15
