[package]
name = "agentspace-detach"
version = "0.7.0"
edition.workspace = true
description = "Starting a program that outlives the call: WMI's Win32_Process.Create (docs/driver.md, Starting a provisioning run; D48, D55)"
publish = false

[lib]
name = "agentspace_detach"
path = "src/lib.rs"

# Test-only. The program this crate's tests start detached: `write` records one variable into a
# file, and `detach` starts `write` through WmiDetach. It is never installed: xtask builds only the
# binaries it names (crates/xtask), and this is not one of them. Tests reach it as
# env!("CARGO_BIN_EXE_detach-test-helper").
[[bin]]
name = "detach-test-helper"
path = "src/bin/detach-test-helper.rs"
test = false

# Only the Windows half uses this (src/wmi.rs and src/logon.rs, the only library modules with
# unsafe code): WMI's Win32_Process.Create, and the logon environment from CreateEnvironmentBlock.
# It is the exact pin agentspace-launch used for WMI before the call moved here. The test helper's
# `ctrlc` mode uses its console calls (Win32_System_Console).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

# The job object the specs put a helper in (tests/spec_detach.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
