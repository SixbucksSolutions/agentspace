[package]
name = "agentspace-state"
version = "0.5.0"
edition.workspace = true
publish = false

[dependencies]
# preserve_order keeps members in the order they are inserted, so a document's members appear in
# the order lease-api.md lists them (Output).
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
# Only the Visitor and DeserializeSeed traits, for the duplicate-member check; this is the version
# already in Cargo.lock (published 2026-07-18).
serde = { version = "=1.0.229", default-features = false }
# No default features: resolve-http and resolve-file stay off, so a validator never fetches a
# reference (D38).
jsonschema = { version = "=0.60.2", default-features = false }

[dev-dependencies]
