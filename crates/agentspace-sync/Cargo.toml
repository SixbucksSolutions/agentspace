[package]
name = "agentspace-sync"
version = "0.6.0"
edition.workspace = true
description = "The operator's sync and deploy, with the stack's template embedded, each host's steps from the platform seam (docs/operator.md; D37, D42, D101)"
publish = false

[lib]
name = "agentspace_sync"
path = "src/lib.rs"

[dependencies]
agentspace-operator-api = { path = "../agentspace-operator-api" }
agentspace-ca = { path = "../agentspace-ca" }
# The start-and-wait step and the instance-ID cache's bytes.
agentspace-box = { path = "../agentspace-box" }
# The forced token push, sync's step 8.
agentspace-push = { path = "../agentspace-push" }
# prepare_child_env, for go build (operator.md, Environment variables).
agentspace-run = { path = "../agentspace-run" }
# write_atomically, for the instance-ID cache (state.md, Replacing a file).
agentspace-state = { path = "../agentspace-state" }
# Target, which names the host a command acts on (D49, D55); the host registry, the project list
# and a host's provisioning run lock.
agentspace-hosts = { path = "../agentspace-hosts" }
# A host's operator alias, and the operator's key and certificate for it (operator.md, How the
# operator reaches a host).
agentspace-alias = { path = "../agentspace-alias" }
agentspace-credential = { path = "../agentspace-credential" }
# provision's step 9: the EC2 driver's place_pending and the Context it takes (operator.md,
# provision; D48, D55).
agentspace-driver-api = { path = "../agentspace-driver-api" }
agentspace-driver-ec2 = { path = "../agentspace-driver-ec2" }
# The platform seam: for_platform, which picks each host's rows, and the Linux rows themselves
# (operator.md, The platform seam; D101). It depends on no crate that depends on this one.
agentspace-platforms = { path = "../agentspace-platforms" }
# The versions already in Cargo.lock. serde: only DeserializeSeed and Visitor, for the
# repeated-member check of the stack parameters file. jsonschema: the stack parameters schema,
# carried inside the operator, with no remote reference fetched (D38).
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
jsonschema = { version = "=0.60.2", default-features = false }

[dev-dependencies]
# The tests compile one small stand-in program and run each test in a child process of its own binary
# (tests/common). The versions the other crates already use.
agentspace-run = { path = "../agentspace-run" }
tempfile = { version = "=3.23.0", default-features = false }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = { version = "=0.10.9", default-features = false }
# CryptProtectData, for the dummy Bot credential of the push test; and SetFileTime, which gives a
# throwaway operator folder its old creation time for the 24-hour sweep's test.
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
# quiet_hard_errors, which bootstrap's unit tests call before they start a file that is not a
# program, so that no start can wait at a modal dialog under any runner (#0227, #0225). The
# library forbids unsafe code, its tests included, so they cannot call SetErrorMode themselves.
agentspace-launch = { path = "../agentspace-launch" }
# Reads back a host's operator certificate in host.rs's unit tests: its key ID and principal. The
# version agentspace-credential already uses.
ssh-key = { version = "=0.6.7", default-features = false, features = ["alloc", "ed25519"] }
