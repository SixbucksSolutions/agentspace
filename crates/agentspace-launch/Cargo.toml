[package]
name = "agentspace-launch"
version = "0.6.0"
edition.workspace = true
description = "Starting a holder: the launch handshake, WMI and the launcher (docs/keeper.md; D42)"
publish = false

[lib]
name = "agentspace_launch"
path = "src/lib.rs"

# Test-only. The stand-in keeper program for this crate's tests: with the private launcher argument
# it runs `run_launcher`, and with `--sleep <secs>` it is a stub holder that sleeps. It is never
# installed: xtask builds only the binaries it names (crates/xtask), and this is not one of them.
# Tests reach it as env!("CARGO_BIN_EXE_agentspace-launch-testhost").
[[bin]]
name = "agentspace-launch-testhost"
path = "src/bin/testhost.rs"
test = false

[dependencies]
agentspace-keeper-api = { path = "../agentspace-keeper-api" }
# The launch files' bytes and the holder command's matcher (docs/state.md, A holder's launch files).
agentspace-keeper-files = { path = "../agentspace-keeper-files" }
# write_atomically, for the request and the result (docs/state.md, Replacing a file).
agentspace-state = { path = "../agentspace-state" }

# Only the Windows half uses these (src/win/), the only modules with unsafe code. windows-sys is the
# version the workspace's other crates use; windows is the exact pin every v0.06-T02 story uses for
# COM, here WMI's Win32_Process.Create.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Rpc",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[dev-dependencies]
# The specs (tests/spec_*.rs): the launch files' parsers, and the Win32 calls that observe and end
# the processes the specs start.
agentspace-keeper-files = { path = "../agentspace-keeper-files" }
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
