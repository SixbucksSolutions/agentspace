# Installed by scripts\agentspace.ps1 sync to /etc/ssh/sshd_config.d/ (decision D7).
# sshd keeps the first value it reads for each keyword and reads this file before
# 60-cloudimg-settings.conf; install.sh checks with sshd -T that both values below took effect.
#
# Trust user certificates signed by the agentspace SSH CA. sync replaces
# /etc/ssh/agentspace_ca.pub with the laptop CA's public key, so a new CA drops the old one.
TrustedUserCAKeys /etc/ssh/agentspace_ca.pub
# No login as root by any means, a CA certificate naming root among them.
PermitRootLogin no
