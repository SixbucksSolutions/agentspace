# Read as text by agentspace-idle-check.ps1, never run: each line NAME=value, and a line starting
# with # is ignored. A missing file or setting takes the check's own default.
# Minutes with no session and no CPU work before the host powers off.
IDLE_MINUTES=60
# CPU-seconds of work per 5-minute check that count as activity.
BUSY_CPU_SECONDS=6
# Minutes past the lease horizon after which the host powers off at the first check with no SSH or
# Session Manager session and no patch run, whatever its CPU is doing (D56, D57, D96). The horizon
# is in C:\ProgramData\agentspace\lease-horizon, sent by the guard.
HORIZON_GRACE_MINUTES=15
