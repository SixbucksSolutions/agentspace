[package]
name = "agentspace-operator"
version = "0.6.0"
edition.workspace = true
description = "The operator's front: command line, help, usage errors and messages (docs/operator.md; D42)"
publish = false

[lib]
name = "agentspace_operator"
path = "src/lib.rs"

[[bin]]
name = "agentspace-operator"
path = "src/main.rs"

[dependencies]
agentspace-operator-api = { path = "../agentspace-operator-api" }
agentspace-box = { path = "../agentspace-box" }
agentspace-run = { path = "../agentspace-run" }
agentspace-push = { path = "../agentspace-push" }
agentspace-ca = { path = "../agentspace-ca" }
agentspace-sync = { path = "../agentspace-sync" }
agentspace-state = { path = "../agentspace-state" }
# The host registry, the host a command acts on, and a host's paths (D45, D49, D55).
agentspace-hosts = { path = "../agentspace-hosts" }
# -Host's value is a project in the lease CLI's form (operator.md, Command line).
agentspace-values = { path = "../agentspace-values" }
# The operator's key and certificate, and a host's operator alias (operator.md, How the operator
# reaches a host).
agentspace-credential = { path = "../agentspace-credential" }
agentspace-alias = { path = "../agentspace-alias" }
# The laptop's offset from UTC, for status -All's Guard line (operator.md, status; E0.08-T03-S02).
agentspace-zone = { path = "../agentspace-zone" }
# The guard's run, which `guard` calls (operator.md, guard; D56, D63; E0.08-T03-S02).
agentspace-guard = { path = "../agentspace-guard" }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }

[dev-dependencies]
tempfile = { version = "=3.23.0", default-features = false }
# The command tests' own calls (E0.06-T03-S01): the stamp's SHA-256, and CryptProtectData for a
# dummy Bot credential. The versions agentspace-push's tests already use.
sha2 = { version = "=0.10.9", default-features = false }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
