# Installed by scripts\agentspace.ps1 sync to /etc/ssh/sshd_config.d/ (decisions D7, D12 and D14).
# sshd keeps the first value it reads for each keyword and reads this file before
# 60-cloudimg-settings.conf; install.sh checks with sshd -T that every value below took effect.
# This file MUST NOT set a keyword that 50-agentspace-ca.conf or another drop-in already sets.
#
# Every connection through Session Manager reaches sshd from 127.0.0.1, so a penalty on that
# address would refuse every login, Terry's included. Exempt it from PerSourcePenalties.
PerSourcePenaltyExemptList 127.0.0.1
# A refused login through Session Manager is not closed on the box, so its sshd-session holds a
# pre-authentication slot for this long. The default is 120 seconds; a real login through
# Session Manager authenticates in well under 5 seconds, so 30 keeps a wide margin.
LoginGraceTime 30
# Drop a logged-in session whose client has gone, within 90 seconds (D12, card #0044).
# The Session Manager tunnel never passes a client's close on to sshd (D10, E2.08), so without
# this a dead holder's sshd-session keeps 127.0.0.1:8811 and :53147 bound until it is killed.
# sshd sends a keepalive probe after ClientAliveInterval seconds with nothing from the client, and
# drops the session at the probe after ClientAliveCountMax unanswered ones, so a dead client is
# dropped (ClientAliveCountMax + 1) x ClientAliveInterval = 6 x 15 = 90 seconds after the last
# packet sshd had from it. Nothing in the tunnel answers a probe; only an SSH client does.
# In the box's OpenSSH 10.2p1 (serverloop.c), sshd probes only when it waits a whole interval
# with nothing to do on any of the session's sockets, so steady activity on the box's side, such
# as calls to the board through the dead forward every few seconds, can put the drop off; a
# 15-second interval keeps that window small.
# A live client answers every probe, whatever its own ServerAliveInterval, and any packet from it
# resets the count, so only a client silent for 90 seconds is dropped. The desktop app gives up on
# its own after about 45 seconds of silence (ServerAliveInterval 15, ServerAliveCountMax 3), so
# this never drops a desktop-app connection it would have kept. A lease alias (30 and 4) itself
# waits about 120 seconds, so a stall of 90 to 120 seconds now ends its session from the box's
# side. The 90 seconds stays under the 2-minute limit with room for sshd's one-second clock.
# These apply only after login: LoginGraceTime alone bounds a refused login, and MaxStartups and
# PerSourcePenalties count only connections that have not logged in.
ClientAliveInterval 15
ClientAliveCountMax 5
