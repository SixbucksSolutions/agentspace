[package]
name = "agentspace-guard"
version = "0.8.0"
edition.workspace = true
description = "The guard's run: stops every host no live lease explains and sends each running host its lease horizon (docs/operator.md, guard; D56, D57, D63)"
publish = false

[lib]
name = "agentspace_guard"
path = "src/lib.rs"

# The architect's stub (D63), committed before v0.08-T03: E0.08-T03-S01 (#0177) builds the run
# behind this API, and adds the crates it needs (agentspace-state, agentspace-hosts and
# agentspace-box among them). E0.08-T03-S02 (#0178) calls it from the operator.
[dependencies]
agentspace-operator-api = { path = "../agentspace-operator-api" }
agentspace-box = { path = "../agentspace-box" }
agentspace-state = { path = "../agentspace-state" }
agentspace-hosts = { path = "../agentspace-hosts" }
# A host's platform rows, picked with `for_platform` and nothing else (D101; operator.md, The platform
# seam): the horizon send's Session Manager document.
agentspace-platforms = { path = "../agentspace-platforms" }
# The one formatter of the guard's stop time (`local_clock_time`, `clock_time_at`).
agentspace-zone = { path = "../agentspace-zone" }

[dev-dependencies]
# Throwaway folders for the log's tests; the version agentspace-hosts's tests use.
tempfile = { version = "=3.23.0", default-features = false }
# The scripted AWS answers of src/run.rs's tests; the version agentspace-box uses.
serde_json = { version = "=1.0.154" }
